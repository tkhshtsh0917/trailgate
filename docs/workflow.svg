<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" role="img" aria-labelledby="title description">
  <title id="title">Langfuse and Trailgate trajectory workflow</title>
  <desc id="description">An agent application sends telemetry to Langfuse and records exact model-boundary content in a private sidecar. Trailgate imports bounded Langfuse data, preserves source evidence, audits it against human declarations, then writes private diagnostic episodes and gated Chat SFT rows.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#67d7e9"/>
    </marker>
    <marker id="side-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffbb73"/>
    </marker>
    <marker id="gate-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a8e6a1"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .heading { fill: #f5f8ff; font-size: 29px; font-weight: 700; }
      .subtitle { fill: #aebdd2; font-size: 17px; }
      .label { fill: #f5f8ff; font-size: 21px; font-weight: 700; }
      .detail { fill: #d3def0; font-size: 16px; }
      .note { fill: #aebdd2; font-size: 15px; }
      .card { fill: #17253b; stroke: #3a526f; stroke-width: 2; }
      .accent { fill: #67d7e9; }
      .side { fill: #ffbb73; }
      .gate { fill: #a8e6a1; }
      .flow { fill: none; stroke: #67d7e9; stroke-width: 3; marker-end: url(#arrow); }
      .sideflow { fill: none; stroke: #ffbb73; stroke-width: 3; stroke-dasharray: 8 6; marker-end: url(#side-arrow); }
      .gateflow { fill: none; stroke: #a8e6a1; stroke-width: 3; marker-end: url(#gate-arrow); }
    </style>
  </defs>

  <rect width="1280" height="600" rx="22" fill="#0c1628"/>
  <text class="heading" x="40" y="55">From Langfuse telemetry to reviewed trajectory views</text>
  <text class="subtitle" x="40" y="83">Trailgate preserves source evidence before deciding what can enter a training view.</text>

  <rect class="card" x="40" y="125" width="270" height="140" rx="14"/>
  <rect class="accent" x="40" y="125" width="270" height="7" rx="3"/>
  <text class="label" x="60" y="170">Agent application</text>
  <text class="detail" x="60" y="201">Model calls and tool use</text>
  <text class="detail" x="60" y="226">Generation has capture ID</text>

  <rect class="card" x="355" y="125" width="270" height="140" rx="14"/>
  <rect class="accent" x="355" y="125" width="270" height="7" rx="3"/>
  <text class="label" x="375" y="170">Langfuse</text>
  <text class="detail" x="375" y="201">Traces and observations</text>
  <text class="detail" x="375" y="226">Scores can arrive later</text>

  <rect class="card" x="670" y="125" width="270" height="140" rx="14"/>
  <rect class="accent" x="670" y="125" width="270" height="7" rx="3"/>
  <text class="label" x="690" y="170">Collection route</text>
  <text class="detail" x="690" y="201">Bounded REST / saved pages</text>
  <text class="detail" x="690" y="226">or enriched blob mirror</text>

  <rect class="card" x="985" y="125" width="255" height="140" rx="14"/>
  <rect class="accent" x="985" y="125" width="255" height="7" rx="3"/>
  <text class="label" x="1005" y="170">Private archive</text>
  <text class="detail" x="1005" y="201">Raw bytes and hashes</text>
  <text class="detail" x="1005" y="226">Uncertainty retained</text>

  <path class="flow" d="M 310 195 H 350"/>
  <path class="flow" d="M 625 195 H 665"/>
  <path class="flow" d="M 940 195 H 980"/>

  <rect class="card" x="40" y="365" width="270" height="145" rx="14"/>
  <rect class="side" x="40" y="365" width="270" height="7" rx="3"/>
  <text class="label" x="60" y="409">Capture sidecar</text>
  <text class="detail" x="60" y="440">Model input and tool schemas</text>
  <text class="detail" x="60" y="465">Delivered tool values</text>
  <path class="sideflow" d="M 175 265 V 360"/>
  <path class="sideflow" d="M 310 397 H 334 V 316 H 805 V 270"/>
  <text class="note" x="385" y="306">Optional capture.jsonl in a saved API snapshot</text>

  <rect class="card" x="355" y="365" width="270" height="145" rx="14"/>
  <rect class="gate" x="355" y="365" width="270" height="7" rx="3"/>
  <text class="label" x="375" y="409">Human declarations</text>
  <text class="detail" x="375" y="440">Rights, privacy, quality review</text>
  <text class="detail" x="375" y="465">Task-level split evidence</text>

  <rect class="card" x="670" y="365" width="270" height="145" rx="14"/>
  <rect class="gate" x="670" y="365" width="270" height="7" rx="3"/>
  <text class="label" x="690" y="409">Audit and gates</text>
  <text class="detail" x="690" y="440">Report / graph / evaluate</text>
  <text class="detail" x="690" y="465">Select supported decisions</text>

  <rect class="card" x="985" y="365" width="255" height="145" rx="14"/>
  <rect class="gate" x="985" y="365" width="255" height="7" rx="3"/>
  <text class="label" x="1005" y="409">Private exports</text>
  <text class="detail" x="1005" y="440">Gated Chat SFT + manifest</text>
  <text class="detail" x="1005" y="465">Diagnostic episodes</text>

  <path class="gateflow" d="M 625 437 H 665"/>
  <path class="gateflow" d="M 940 437 H 980"/>
  <path class="flow" d="M 1112 265 V 329 H 805 V 360"/>

  <text class="note" x="40" y="558">Scores stay later evidence. Blob intake without model-boundary capture remains diagnostic; the core makes no model call.</text>
</svg>
