[project]
name = "trailgate"
version = "0.1.0"
description = "Stitch agent traces into auditable trajectories and export eligible training data, starting with Langfuse."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["agents", "trajectories", "langfuse", "training-data"]
authors = [
    { name = "tkhshtsh0917", email = "48384135+tkhshtsh0917@users.noreply.github.com" }
]
requires-python = ">=3.12.13"
dependencies = []

[project.urls]
Repository = "https://github.com/tkhshtsh0917/trailgate"

[project.scripts]
trailgate = "trailgate.cli:main"

[project.optional-dependencies]
live = [
    "langfuse>=4.8.1,<5",
    "openai>=2",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["README.ja.md", "ROADMAP.md", "docs/RELEASING.md"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "ruff==0.17.2",
]
