name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12.13", "3.13.15", "3.14.7"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.12.10"
          python-version: ${{ matrix.python-version }}
      - name: Sync
        run: uv sync --locked --python ${{ matrix.python-version }}
      - name: Lint
        run: uv run --locked ruff check src tests examples scripts
      - name: Format
        run: uv run --locked ruff format --check src tests examples scripts
      - name: Compile
        run: uv run --locked python -m compileall -q src tests examples scripts
      - name: Test
        run: uv run --locked python -m unittest discover -s tests -v
      - name: Optional Parquet path
        if: matrix.python-version == '3.12.13'
        run: uv run --locked --extra bulk-parquet python -m unittest discover -s tests -p test_bulk_archive.py -v
      - name: Bulk resource gate
        if: matrix.python-version == '3.12.13'
        run: uv run --locked --extra bulk-parquet python scripts/benchmark_bulk.py --rows 100000 --max-rss-mib 1024
      - name: High-cardinality bulk resource gate
        if: matrix.python-version == '3.12.13'
        run: uv run --locked --extra bulk-parquet python scripts/benchmark_bulk.py --rows 100000 --observations-per-trace 1 --max-rss-mib 1024
      - name: CLI
        run: uv run --locked trailgate doctor --source langfuse --input examples/synthetic/snapshot
      - name: Build
        run: uv build
      - name: Release artifact contract
        run: uv run --locked python scripts/check_release_artifacts.py
      - name: Public files
        run: uv run --locked python scripts/check_public_files.py
